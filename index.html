<title>Switchyard Flowchart Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:wght@400;600;700&family=Caveat:wght@400;700&family=Fraunces:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&family=Nunito:ital,wght@0,400;0,700;1,400&family=Patrick+Hand&family=Roboto+Slab:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a drafting-table shell. Shape library left, live canvas centre, inspector right; on phones both side panels become bottom sheets. */
:root{
  --bg:#e7eaef; --chrome:#f7f8fa; --panel:#ffffff; --ink:#151a23; --muted:#5b6476; --faint:#8a93a5;
  --line:#d9dde5; --line-strong:#c2c8d3; --hover:#eef1f6; --thumb:#ffffff;
  --accent:#3355d1; --accent-ink:#ffffff; --accent-soft:#e3e8fa; --sel:#3355d1; --guide:#e0457b; --danger:#c43d1b;
  --shadow:0 1px 2px rgba(18,24,38,.06),0 10px 28px rgba(18,24,38,.10);
  --ui:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --display:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0e13; --chrome:#11151c; --panel:#141921; --ink:#e6e9ef; --muted:#9aa3b5; --faint:#6b7488;
    --line:#252b36; --line-strong:#353c4a; --hover:#1b212b; --thumb:#1c2230;
    --accent:#7f9af3; --accent-ink:#0b0e13; --accent-soft:#1d2742; --sel:#7f9af3; --guide:#f06292; --danger:#f0784f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0e13; --chrome:#11151c; --panel:#141921; --ink:#e6e9ef; --muted:#9aa3b5; --faint:#6b7488;
  --line:#252b36; --line-strong:#353c4a; --hover:#1b212b; --thumb:#1c2230;
  --accent:#7f9af3; --accent-ink:#0b0e13; --accent-soft:#1d2742; --sel:#7f9af3; --guide:#f06292; --danger:#f0784f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.45); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--ui);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}

/* header */
.top{display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--chrome);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font:700 16px/1 var(--display);letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:26px;height:26px;flex:none}
.doc-title{flex:0 1 260px;min-width:60px;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 8px;font-weight:500;color:var(--ink);text-overflow:ellipsis}
.doc-title:hover{border-color:var(--line)}
.doc-title:focus{border-color:var(--accent);background:var(--panel);outline:none}
.spacer{flex:1}
.acts{display:flex;align-items:center;gap:6px;min-width:0}
.vsep{width:1px;height:22px;background:var(--line);margin-inline:2px}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink);flex:none}
.ib:hover{background:var(--hover)}
.ib:disabled{opacity:.35;cursor:default;background:transparent}
.ib svg,.btn svg,.tool svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{height:28px;padding:0 10px;font-size:12px}
.tpl{height:32px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);padding:0 8px;max-width:160px}

/* main */
.work{display:grid;grid-template-columns:var(--lw,228px) minmax(0,1fr) var(--pw,296px);min-height:0}
.ib.on{background:var(--accent-soft);color:var(--ink)}
.lnk{display:inline-block;width:16px;height:3px;border-radius:2px;flex:none}
.epres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.epres .btn{justify-content:flex-start;padding:0 8px;min-width:0;overflow:hidden}
.pnote{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
.ptoggle{cursor:pointer}
.ptoggle:hover rect{fill-opacity:.32}
.ph-x{position:absolute;right:8px;top:8px;width:28px;height:28px}
.lib{position:relative}
.lib-x{position:absolute;right:8px;top:8px;width:28px;height:28px;z-index:1}
.lib-x svg{transform:scaleX(-1)}
@media (min-width: 901px){ .lib-sec:first-of-type>summary{margin-right:32px} }
@media (min-width: 901px){ .work>.stagewrap{grid-column:2} .work.no-lib{--lw:0px} .work.no-lib .lib{display:none} .work.no-panel{--pw:0px} .work.no-panel .panel{display:none} .panel .ph{padding-right:48px} }
.lib,.panel{background:var(--chrome);overflow:auto;min-height:0}
.lib{border-right:1px solid var(--line);padding:12px 12px 24px}
.panel{border-left:1px solid var(--line);padding:0 0 32px}
.sheet-head{display:none}
.lib h4{margin:14px 2px 8px;font:600 11px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.lib h4:first-of-type{margin-top:4px}
.lib-sec>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:6px;margin:6px 0 2px;padding:8px 6px;border-radius:6px;font:600 11px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);cursor:pointer;user-select:none}
.lib-sec>summary::-webkit-details-marker{display:none}
.lib-sec>summary:hover{background:var(--hover);color:var(--ink)}
.lib-sec>summary .cnt{margin-left:auto;font:500 10.5px/1 var(--mono);letter-spacing:0}
.lib-sec>summary svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
.lib-sec:not([open])>summary svg{transform:rotate(-90deg)}
.lib-sec>.lib-grid{padding-bottom:6px}
.lib-sec:first-of-type>summary{margin-top:0}
.lib-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lib-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:10.5px;line-height:1.15;text-align:center}
.lib-item svg{width:46px;height:32px;color:var(--ink)}
.lib-item:hover{background:var(--hover);color:var(--ink)}
.lib-item.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.th{fill:var(--thumb);stroke:currentColor}
.lib-tip{margin:16px 2px 0;color:var(--faint);font-size:11.5px;line-height:1.5}

/* stage */
.stagewrap{position:relative;overflow:hidden;min-width:0;background:var(--bg)}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#stage[data-tool="pan"],#stage.panning{cursor:grab}
#stage.grabbing{cursor:grabbing}
#stage[data-shape="1"],#stage[data-tool="connector"],#stage[data-tool="arrow"]{cursor:crosshair}
#stage[data-tool="text"]{cursor:text}
#nodesL [data-kind],#edgesL [data-kind]{cursor:default}
#stage[data-tool="select"] #nodesL [data-kind]:not(.locked){cursor:move}
#edgesL .ehit{pointer-events:stroke}
#edgesL .vis{pointer-events:none}
#ovL *{pointer-events:none;vector-effect:non-scaling-stroke}
#ovL [data-h]{pointer-events:all}
.ov-box{fill:none;stroke:var(--sel);stroke-width:1.5}
.ov-group{fill:none;stroke:var(--sel);stroke-width:1;stroke-dasharray:5 4}
.ov-hover{fill:none;stroke:var(--sel);stroke-width:1;opacity:.55}
.ov-handle{fill:#fff;stroke:var(--sel);stroke-width:1.5}
.ov-handle[data-dir="n"],.ov-handle[data-dir="s"]{cursor:ns-resize}
.ov-handle[data-dir="e"],.ov-handle[data-dir="w"]{cursor:ew-resize}
.ov-handle[data-dir="nw"],.ov-handle[data-dir="se"]{cursor:nwse-resize}
.ov-handle[data-dir="ne"],.ov-handle[data-dir="sw"]{cursor:nesw-resize}
.ov-rotline{stroke:var(--sel);stroke-width:1}
.ov-rot{fill:var(--sel);stroke:#fff;stroke-width:1.5;cursor:grab}
.ov-nub{fill:var(--sel);stroke:#fff;stroke-width:1.5;cursor:crosshair;opacity:.85}
.ov-nub:hover{opacity:1}
.ov-end{fill:#fff;stroke:var(--sel);stroke-width:2;cursor:move}
.ov-end.att{fill:var(--sel);stroke:#fff}
.ov-esel{fill:none;stroke:var(--sel);opacity:.22;stroke-linecap:round;stroke-linejoin:round}
.ov-guide{stroke:var(--guide);stroke-width:1;stroke-dasharray:4 3}
.ov-marq{fill:var(--sel);fill-opacity:.08;stroke:var(--sel);stroke-width:1}
.ov-drop{fill:none;stroke:var(--sel);stroke-width:2;opacity:.8}
.ov-port{fill:#fff;stroke:var(--sel);stroke-width:1.5}
.ov-port.on{fill:var(--sel)}
.ov-draw{fill:var(--sel);fill-opacity:.06;stroke:var(--sel);stroke-width:1.5;stroke-dasharray:6 4}
.ov-lock{fill:var(--sel)}

#editor{position:absolute;z-index:6;border:0;padding:0;margin:0;resize:none;overflow:hidden;background:transparent;outline:1.5px dashed var(--sel);outline-offset:3px;border-radius:2px;line-height:1.3;white-space:pre-wrap;box-sizing:border-box}

.dock{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:2px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.tool{position:relative;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:8px;border:0;background:transparent;color:var(--ink);flex:none}
.tool:hover{background:var(--hover)}
.tool.on{background:var(--accent);color:var(--accent-ink)}
.tool kbd{position:absolute;right:3px;bottom:2px;font:500 8.5px/1 var(--mono);color:var(--faint);pointer-events:none}
.tool.on kbd{color:var(--accent-ink);opacity:.75}
.dock .vsep{height:24px}
.mobile-only{display:none!important}

.zoombar{position:absolute;left:12px;bottom:12px;z-index:5;display:flex;align-items:center;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.zoombar .ib{width:30px;height:30px}
.zoombar .zv{min-width:52px;height:30px;border:0;background:transparent;border-radius:6px;font:500 12px/1 var(--mono);font-variant-numeric:tabular-nums}
.zoombar .zv:hover{background:var(--hover)}
.minimap{position:absolute;right:12px;bottom:12px;z-index:5;width:184px;height:124px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer}
.minimap svg{width:100%;height:100%;display:block}
.mm-view{fill:var(--sel);fill-opacity:.1;stroke:var(--sel);stroke-width:1.5;vector-effect:non-scaling-stroke}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:5;padding:7px 12px;border-radius:999px;background:var(--ink);color:var(--panel);font-size:12px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;pointer-events:none}

/* panel */
.ph{position:sticky;top:0;z-index:2;display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:14px 16px 10px;background:var(--chrome);border-bottom:1px solid var(--line)}
.ph b{font:700 15px/1.2 var(--display)}
.ph .muted{color:var(--faint);font-size:11.5px}
.panel section{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.panel h3{margin:0;font:600 10.5px/1 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row>select{flex:1;min-width:0}
.panel select,.panel input[type=text],.panel input[type=number],.panel textarea,.fld input{height:30px;border:1px solid var(--line-strong);border-radius:6px;background:var(--panel);padding:0 8px;min-width:0}
.panel textarea{height:auto;padding:6px 8px;resize:vertical;line-height:1.4;width:100%;box-sizing:border-box}
.panel input[type=number]{width:62px;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;padding-right:2px}
.fld{display:grid;gap:4px;font-size:11.5px;color:var(--muted)}
.fld input{width:100%;box-sizing:border-box}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden;background:var(--panel);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 8px;font-size:12px;line-height:1.2;color:var(--muted);min-width:28px}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{background:var(--hover);color:var(--ink)}
.seg button.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.seg svg{width:16px;height:16px;display:block;margin:auto;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.seg.full{display:flex}
.seg.full button{flex:1}
.tog{border:1px solid var(--line-strong);background:var(--panel);border-radius:6px;height:30px;min-width:30px;padding:0 8px;color:var(--muted)}
.tog:hover{background:var(--hover);color:var(--ink)}
.tog.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.sw{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 3px;border:1px solid var(--line-strong);border-radius:6px;background:var(--panel);font-size:12px;color:var(--muted);cursor:pointer}
.sw input{width:24px;height:22px;border:0;padding:0;background:transparent;cursor:pointer}
.sw input::-webkit-color-swatch-wrapper{padding:0}
.sw input::-webkit-color-swatch{border:1px solid rgba(0,0,0,.18);border-radius:4px}
.sw input::-moz-color-swatch{border:1px solid rgba(0,0,0,.18);border-radius:4px}
.rng{display:grid;grid-template-columns:62px 1fr 40px;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.rng input{width:100%;accent-color:var(--accent)}
.rng output{font:12px/1 var(--mono);text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.presets{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.preset{aspect-ratio:1;max-width:100%;border-radius:6px;border:2px solid;font:600 11px/1 var(--ui);padding:0}
.preset:hover{transform:translateY(-1px)}
.ecol{aspect-ratio:1;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line-strong);padding:0}
.ecol.on{box-shadow:0 0 0 2px var(--accent)}
.pats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.pat{padding:0;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;aspect-ratio:1;background:var(--panel)}
.pat svg{width:100%;height:100%;display:block}
.pat.on{outline:2px solid var(--accent);outline-offset:1px}
.xywh{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.xywh label{display:grid;gap:3px;font:500 10.5px/1 var(--mono);color:var(--faint);text-transform:uppercase}
.xywh input{width:100%!important;box-sizing:border-box;padding:0 4px!important}
.iconrow{display:flex;gap:4px;flex-wrap:wrap}
.iconrow .ib{border:1px solid var(--line-strong);background:var(--panel)}
.iconrow .ib:hover{background:var(--hover)}
.iconrow .ib.on{background:var(--accent-soft);border-color:var(--accent)}
.iconrow .ib.danger{color:var(--danger)}
.tips{margin:0;padding:0;list-style:none;display:grid;gap:7px;color:var(--muted);font-size:12px;line-height:1.45}
.tips kbd,.keys kbd{font:500 11px/1 var(--mono);padding:2px 5px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;background:var(--panel);color:var(--ink);white-space:nowrap}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat div{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.stat b{display:block;font:600 18px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--faint)}
.bgs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bgb{width:30px;height:30px;border-radius:7px;border:1px solid var(--line-strong);padding:0}
.bgb.on{outline:2px solid var(--accent);outline-offset:1px}

/* status */
.status{display:flex;gap:14px;align-items:center;padding-block:5px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--chrome);color:var(--faint);font-size:11.5px;white-space:nowrap;overflow:hidden}
.status .num{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.status .right{margin-left:auto}
.status .credit{color:var(--muted);padding-left:14px;border-left:1px solid var(--line)}
@media (max-width: 900px){ .status .credit{margin-left:auto;border-left:0;padding-left:0} }

/* menu, modal, toast */
.menu{position:fixed;z-index:50;min-width:220px;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.menu button{display:flex;width:100%;justify-content:space-between;gap:16px;border:0;background:transparent;padding:7px 10px;border-radius:6px;text-align:left;font-size:12.5px}
.menu button:hover:not(:disabled){background:var(--hover)}
.menu button:disabled{opacity:.4;cursor:default}
.menu button span{color:var(--faint);font:11px/1.4 var(--mono)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(10,14,22,.45);padding:16px}
.mbox{width:min(680px,100%);max-height:calc(100% - 16px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px 20px;display:grid;gap:12px}
.mhead{display:flex;align-items:center;justify-content:space-between}
.mhead h2{margin:0;font:700 19px/1.2 var(--display)}
.mbox p{margin:0;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.tabs button.on{border-color:var(--accent);color:var(--ink)}
.exp-prev{display:grid;place-items:center;min-height:180px;max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:repeating-conic-gradient(var(--hover) 0 25%,var(--panel) 0 50%) 0 0/16px 16px;padding:12px}
.exp-prev img{max-width:100%;max-height:330px;height:auto;box-shadow:var(--shadow)}
.code{width:100%;box-sizing:border-box;min-height:200px;font:12px/1.5 var(--mono);border:1px solid var(--line-strong);border-radius:8px;background:var(--chrome);padding:10px;resize:vertical}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--danger)!important}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 24px}
.keys div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.demo-shield{position:fixed;inset:0;z-index:85;cursor:not-allowed}
.demo-bar{position:fixed;z-index:95;left:50%;transform:translateX(-50%);bottom:calc(40px + env(safe-area-inset-bottom,0px));width:min(620px,calc(100% - 32px));box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:grid;gap:8px}
.db-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.db-top b{font:700 14px/1.25 var(--display)}
.db-count{font:12px/1 var(--mono);color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.db-say{margin:0;font-size:13.5px;line-height:1.5;min-height:3em;color:var(--ink)}
.db-prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.db-prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.db-ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.db-ctrl .spacer{flex:1}
.db-ctrl .btn:disabled{opacity:.4;cursor:default}
.demo-cursor{position:fixed;left:0;top:0;z-index:96;pointer-events:none;width:24px;height:24px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.demo-ripple{position:fixed;z-index:96;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid var(--accent);pointer-events:none;animation:dr .55s ease-out forwards}
@keyframes dr{from{transform:scale(.3);opacity:1}to{transform:scale(1.25);opacity:0}}
.demo-key{position:fixed;z-index:96;pointer-events:none;font:600 14px/1 var(--mono);padding:6px 9px;border:1px solid var(--line-strong);border-bottom-width:3px;border-radius:6px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);animation:dk 1s ease forwards}
@keyframes dk{0%{opacity:0;transform:translateY(4px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
body.demo .hint{display:none}
@media (prefers-reduced-motion: reduce){ .demo-ripple,.demo-key{animation:none;opacity:0} }
.toast{position:fixed;left:50%;bottom:calc(48px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:9px;font-size:12.5px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width: 900px){
  .work{grid-template-columns:minmax(0,1fr)}
  .lib,.panel{position:fixed;left:0;right:0;bottom:0;z-index:40;max-height:60%;border:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .22s ease;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .lib{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .lib.open,.panel.open{transform:none}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;font:700 15px/1 var(--display);padding:4px 0 6px}
  .lib-grid{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
  .mobile-only{display:inline-grid!important}
  .desk-only{display:none!important}
  .minimap{display:none}
  .lbl{display:none}
  .btn{padding:0 9px}
  .tpl{max-width:110px}
  .doc-title{flex:1 1 auto}
  .brand span{display:none}
  .dock{top:8px}
  .hint{bottom:58px}
  .ph{padding-top:16px}
  .status .hide-sm{display:none}
}

.tour-block{position:fixed;inset:0;z-index:79}
.tour-spot{position:fixed;z-index:80;border-radius:10px;box-shadow:0 0 0 9999px rgba(10,14,22,.55);outline:2px solid var(--accent);outline-offset:2px;pointer-events:none;transition:left .25s,top .25s,width .25s,height .25s}

const mctx=document.createElement('canvas').getContext('2d');

function wrap(text,font,maxW){
  mctx.font=font; const out=[];
  for(const para of String(text).split('\n')){
    if(!para){ out.push(''); continue; }
    const words=para.split(' '); let line='';
    for(let w of words){
      if(mctx.measureText(w).width>maxW){ // break long words
        if(line){ out.push(line); line=''; }
        let chunk=''; for(const ch of w){ if(mctx.measureText(chunk+ch).width>maxW&&chunk){ out.push(chunk); chunk=ch; } else chunk+=ch; }
        line=chunk; continue;
      }
      const t=line?line+' '+w:w;
      if(mctx.measureText(t).width>maxW&&line){ out.push(line); line=w; } else line=t;
    }
    out.push(line);
  }
  return out;
}

const kidsOf=(id,nodes)=>(nodes||doc.nodes).filter(m=>m.parentId===id).sort((a,b)=>a.y-b.y||a.x-b.x);
function collapsedDims(n,nodes){ const k=kidsOf(n.id,nodes).length, lines=Math.max(1,Math.min(k,6)), lh=n.style.fontSize*1.45; return {w:Math.max(220,Math.min(n.w,260)),h:Math.round(phaseHead(n)+14+lines*lh+12)}; }

function cloudPath(w,h){

function geom(n){

    case 'predefined': main=rr(0,0,w,h,0); extra=[`M12 0V${f(h)}M${f(w-12)} 0V${f(h)}`]; tb={x:18,y:P,w:w-36,h:h-2*P}; break;
    case 'manual': main=`M0 ${f(h*.25)}L${f(w)} 0V${f(h)}H0Z`; tb={x:P,y:h*.25+4,w:w-2*P,h:h*.75-P-4}; break;
    case 'delay': { const rx=Math.min(h/2,w/2); main=`M0 0H${f(w-rx)}A${f(rx)} ${f(h/2)} 0 0 1 ${f(w-rx)} ${f(h)}H0Z`; tb={x:P,y:P,w:w-rx*.6-2*P,h:h-2*P}; break; }
    case 'hexagon': { const i=Math.min(w*.2,h*.5); main=`M${f(i)} 0H${f(w-i)}L${f(w)} ${f(h/2)}L${f(w-i)} ${f(h)}H${f(i)}L0 ${f(h/2)}Z`; tb={x:i*.75,y:P,w:w-1.5*i,h:h-2*P}; break; }
    case 'ellipse': case 'circle': main=`M0 ${f(h/2)}A${f(w/2)} ${f(h/2)} 0 1 1 ${f(w)} ${f(h/2)}A${f(w/2)} ${f(h/2)} 0 1 1 0 ${f(h/2)}Z`; tb={x:w*.15,y:h*.15,w:w*.7,h:h*.7}; break;
    case 'triangle': main=`M${f(w/2)} 0L${f(w)} ${f(h)}H0Z`; tb={x:w*.22,y:h*.42,w:w*.56,h:h*.52}; break;
    case 'star': main=starPath(w,h); tb={x:w*.3,y:h*.38,w:w*.4,h:h*.34}; break;

const DIRS={n:[0,-1],e:[1,0],s:[0,1],w:[-1,0]};
function portLocal(n,side){

  switch(n.shape){
    case 'npn': P.w=[0,h/2]; P.n=[w*.75,0]; P.s=[w*.75,h]; break;
    case 'opamp': P.w1=[0,h*.3]; P.w2=[0,h*.7]; break;
    default: if(ELEC2.has(n.shape)){ P.w=[0,h*.62]; P.e=[w,h*.62]; } break;
    case 'data': { const k=skewOf(n); P.e=[w-k/2,h/2]; P.w=[k/2,h/2]; break; }
    case 'triangle': P.e=[w*.75,h/2]; P.w=[w*.25,h/2]; break;
    case 'document': P.s=[w/2,h*.88]; break;

    case 'manual': P.n=[w/2,h*.125]; break;
    case 'callout': P.s=[w/2,h*.78]; break;

    case 'bond': { const b=btn.dataset.b; checkpoint(); es.forEach(e=>{ if(b==='arrow'){ delete e.style.bond; delete e.style.bondSide; e.style.end='arrow'; } else if(b==='wire'){ delete e.style.bond; delete e.style.bondSide; e.style={...e.style,...WIRE}; } else { if(!e.style.bond) e.style={...e.style,...BOND}; e.style.bond=b; } }); break; }
    case 'epreset': { if(!es.length) return; checkpoint(); es.forEach(e=>applyEdgePreset(e,btn.dataset.p)); break; }

    case 'branchYN': { const n=ns[0]; if(!n) return; checkpoint(); const a=addBranch(n,'s','yes'), b=addBranch(n,'e','no'); sel=new Set([a.id,b.id]); refresh(true); toast('Added Yes and No branches. Double-click each to name it.'); return; }
    case 'toggleCollapse': { const ph=ns.find(n=>n.shape==='phase'); if(ph) toggleCollapse(ph.id); return; }
    case 'unphase': { const ps=ns.filter(n=>n.shape==='phase'); if(!ps.length) return; checkpoint(); const ids=new Set(ps.map(x=>x.id));

    case 'hidePanel': setSide('panel',false); return;
    case 'tpl': loadTemplate(btn.dataset.t); return;

const KEYTOOLS={v:'select',h:'pan',c:'connector',a:'arrow',t:'text',r:'process',d:'decision',o:'ellipse',n:'note',s:'terminator',f:'frame'};
window.addEventListener('keydown',e=>{
  if(editing) return;

  const tg=e.target; if(tg&&tg.closest&&tg.closest('input,textarea,select,[contenteditable]')) return;
  const mod=e.metaKey||e.ctrlKey, k=e.key.toLowerCase();
  if(e.code==='Space'){ e.preventDefault(); if(!spaceDown){ spaceDown=true; stage.classList.add('panning'); } return; }
  if(mod){
    if(k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
    if(k==='y'){ e.preventDefault(); redo(); return; }
    if(k==='c'){ if(e.altKey){ e.preventDefault(); act('copyStyle'); } else if(sel.size){ e.preventDefault(); copySel(); } return; }
    if(k==='x'){ if(sel.size){ e.preventDefault(); copySel(); deleteSel(); } return; }
    if(k==='v'){ if(e.altKey){ e.preventDefault(); act('pasteStyle'); return; } pasteFlag=false; setTimeout(()=>{ if(!pasteFlag) pasteInternal(); },80); return; }
    if(k==='d'){ e.preventDefault(); duplicate(); return; }
    if(k==='a'){ e.preventDefault(); selectAll(); return; }
    if(k==='g'){ e.preventDefault(); act(e.shiftKey?'ungroup':'group'); return; }
    if(e.key===']'){ e.preventDefault(); act('front'); return; }
    if(e.key==='['){ e.preventDefault(); act('back'); return; }
    if(e.key==='='||e.key==='+'){ e.preventDefault(); zoomBy(1.2); return; }
    if(e.key==='-'){ e.preventDefault(); zoomBy(1/1.2); return; }
    if(e.key==='0'){ e.preventDefault(); const r=stage.getBoundingClientRect(); zoomAt(r.width/2,r.height/2,1/view.z); return; }
    return;
  }
  if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); deleteSel(); return; }
  if(e.key==='Escape'){ if(drag){ drag=null; guides=[]; dropTarget=null; render(); } sel.clear(); setTool('select'); afterSel(); hideMenu(); closeSheets(); return; }
  if(e.key==='Enter'){ const ns=selNodes(), es=selEdges(); if(ns.length===1){ e.preventDefault(); startEdit('node',ns[0].id,ns[0].shape==='phase'?'title':'text'); } else if(es.length===1&&!ns.length){ e.preventDefault(); startEdit('edge',es[0].id,'label'); } return; }
  if(e.key.startsWith('Arrow')){ e.preventDefault(); const st=e.shiftKey?10:1; nudge(e.key==='ArrowLeft'?-st:e.key==='ArrowRight'?st:0,e.key==='ArrowUp'?-st:e.key==='ArrowDown'?st:0); return; }
  if(e.key==='!'||(e.shiftKey&&e.code==='Digit1')){ fit(); return; }
  if(e.key==='?'){ showKeys(); return; }
  if(e.key===']'){ act('forward'); return; } if(e.key==='['){ act('backward'); return; }
  if(k==='p'&&!e.altKey&&!e.shiftKey){ e.preventDefault(); if(selNodes().length) nestSel(); else setTool('phase'); return; }
  if(e.key==='.'){ const ph=selNodes().find(n=>n.shape==='phase'); if(ph) toggleCollapse(ph.id); return; }
  if(!e.altKey&&!e.shiftKey&&KEYTOOLS[k]){ setTool(KEYTOOLS[k]); return; }
});

function buildSVG(opts={}){
  const b=contentBounds(), pad=32, W=Math.ceil(b.w+pad*2), H=Math.ceil(b.h+pad*2);

function applyEdgePreset(e,pid){ const P=EDGE_PRESETS.find(x=>x.id===pid); if(!P) return; e.style={...e.style,...P.style}; if(P.label) e.label=P.label; }
function autoBranch(e){ if(doc.autoBranch===false||!e.from) return; const src=getNode(e.from.node); if(!src||src.shape!=='decision') return; const out=doc.edges.filter(x=>x!==e&&x.from&&x.from.node===src.id).length; if(out<2) applyEdgePreset(e,out===0?'yes':'no'); }
function addBranch(n,port,pid,shape='process'){
  const [dx,dy]=DIRS[port[0]], gap=70, [w,h]=SIZES[shape], hid=hiddenSet();
  const m={id:uid(),shape,x:0,y:0,w,h,rot:0,text:'',style:nodeStyleFor(shape)};
  m.x=dx>0?n.x+n.w+gap:dx<0?n.x-gap-w:n.x+n.w/2-w/2; m.y=dy>0?n.y+n.h+gap:dy<0?n.y-gap-h:n.y+n.h/2-h/2;
  for(let i=0;i<8&&doc.nodes.some(o=>!hid.has(o.id)&&o.shape!=='frame'&&o.shape!=='phase'&&overlap(o,m));i++){ if(dx) m.y+=h+30; else m.x+=w+30; }
  m.x=f(m.x); m.y=f(m.y); assignParent(m); doc.nodes.push(m);
  const opp={n:'s',s:'n',e:'w',w:'e'}[port[0]];
  const e={id:uid(),from:{node:n.id,port},to:{node:m.id,port:opp},p1:{x:0,y:0},p2:{x:0,y:0},label:'',labelPos:.5,style:edgeDefaults()};
  doc.edges.push(e); if(pid) applyEdgePreset(e,pid); else autoBranch(e);
  return m;
}
function nextDesig(shape){ const p=DESIG[shape]; if(!p) return ''; let max=0; const re=new RegExp('^'+p+'(\\d+)'); doc.nodes.forEach(m=>{ const mm=String(m.text||'').match(re); if(mm) max=Math.max(max,+mm[1]); }); return p+(max+1); }
function autoEdgeStyle(e){
  const a=e.from&&getNode(e.from.node), b=e.to&&getNode(e.to.node);
  if((a&&a.shape==='atom')||(b&&b.shape==='atom')){ e.style={...e.style,...BOND}; return; }
  if((a&&ELEC.has(a.shape))||(b&&ELEC.has(b.shape))) e.style={...e.style,...WIRE};
}
function chemBuild(kind,cx,cy,nodes,edges){
  const L=44, A=[]; let tagR=null;
  const add=(x,y,text='')=>{ const n={id:uid(),shape:'atom',x:f(x-14),y:f(y-14),w:28,h:28,rot:0,text,style:{...DEF_NODE,...SHAPE_STYLE.atom}}; n.style.color=elementColor(text); if(tagR){ n.ring=tagR; n.ringKind=kind; } nodes.push(n); A.push(n); return n; };
  const bond=(a,b,type='single',side=0)=>{ const e={id:uid(),from:{node:a.id,port:'auto'},to:{node:b.id,port:'auto'},p1:{x:0,y:0},p2:{x:0,y:0},label:'',labelPos:.5,style:{...DEF_EDGE,...BOND,bond:type}}; if(side) e.style.bondSide=side; if(tagR) e.ring=tagR; edges.push(e); return e; };
  const ring=(nv,doubles)=>{ const R=L/(2*Math.sin(Math.PI/nv)), pts=[];
    for(let i=0;i<nv;i++){ const ang=(-90+i*360/nv)*Math.PI/180; pts.push(add(cx+R*Math.cos(ang),cy+R*Math.sin(ang))); }
    for(let i=0;i<nv;i++){ const a=pts[i], b=pts[(i+1)%nv], dbl=doubles.includes(i); let side=0;
      if(dbl){ const tx=b.x-a.x, ty=b.y-a.y, mx=(a.x+b.x)/2+14, my=(a.y+b.y)/2+14; side=Math.sign(-ty*(cx-mx)+tx*(cy-my))||1; }
      bond(a,b,dbl?'double':'single',side); }
    return pts; };
  if(INSERTS[kind]) tagR=uid();
  if(kind==='benzene') ring(6,[0,2,4]);
  else if(kind==='cyclohexane') ring(6,[]);
  else if(kind==='cyclopentane') ring(5,[]);
  else if(kind==='chain'){ const dx=L*Math.cos(Math.PI/6), dy=L*.5; let prev=null; for(let i=0;i<4;i++){ const a=add(cx+(i-1.5)*dx,cy+(i%2?dy/2:-dy/2)); if(prev) bond(prev,a); prev=a; } }
  tagR=null;
  return {atoms:A.slice(),add,bond};
}
function insertChem(kind,at){
  checkpoint(); const nodes=[], edges=[]; chemBuild(kind,at.x,at.y,nodes,edges);
  nodes.forEach(n=>{ doc.nodes.push(n); assignParent(n); }); doc.edges.push(...edges);
  sel=new Set([...nodes.map(n=>n.id),...edges.map(e=>e.id)]); setTool('select'); refresh(true);

function pushAround(p,cw,ch){
  const dw=Math.max(0,p.w-cw), dh=Math.max(0,p.h-ch); if(!dw&&!dh) return;
  const hid=hiddenSet(), desc=descendants(p.id), anc=[]; let q=p,g=0; while(q&&q.parentId&&g++<30){ anc.push(q.parentId); q=getNode(q.parentId); }
  const ancSet=new Set(anc), right=p.x+cw-1, bottom=p.y+ch-1, E={x:p.x,y:p.y,w:p.w,h:p.h}, delta=new Map();
  for(const m of drawOrder()){
    if(m===p||desc.has(m.id)||ancSet.has(m.id)||hid.has(m.id)||m.locked) continue;
    let a=m, gg=0, inh=false; while(a&&a.parentId&&gg++<30){ if(delta.has(a.parentId)){ inh=true; break; } a=getNode(a.parentId); } if(inh) continue;
    if(m.shape==='frame'&&inside({x:p.x,y:p.y,w:cw,h:ch},m)) continue;
    let dx=0, dy=0;
    if(m.x>=right&&m.y<E.y+E.h&&m.y+m.h>E.y) dx=dw;
    else if(m.y>=bottom&&m.x<E.x+E.w&&m.x+m.w>E.x) dy=dh;
    if(dx||dy) delta.set(m.id,[dx,dy]);
  }
  const moved=[], pts=[];
  for(const [id,[dx,dy]] of delta) for(const i of [id,...descendants(id)]){ const m=getNode(i); if(!m) continue; m.x=f(m.x+dx); m.y=f(m.y+dy); moved.push({id:i,dx,dy}); }
  for(const e of doc.edges) for(const [k,end] of [['p1','from'],['p2','to']]){ if(e[end]) continue; const pt=e[k]; let dx=0, dy=0;
    if(pt.x>=right&&pt.y>E.y&&pt.y<E.y+E.h) dx=dw; else if(pt.y>=bottom&&pt.x>E.x&&pt.x<E.x+E.w) dy=dh;
    if(dx||dy){ e[k]={x:pt.x+dx,y:pt.y+dy}; pts.push({id:e.id,k,dx,dy}); } }
  const grow=[], hid2=hiddenSet();
  for(const aid of anc){ const a=getNode(aid); if(!a||a.collapsed||a.shape!=='phase') continue;
    const kids=[...descendants(aid)].map(getNode).filter(m=>m&&!hid2.has(m.id)); if(!kids.length) continue;
    const b=boundsOf(kids), nw=Math.max(a.w,b.x+b.w+20-a.x), nh=Math.max(a.h,b.y+b.h+20-a.y);
    if(nw>a.w||nh>a.h){ grow.push({id:aid,dw:nw-a.w,dh:nh-a.h}); a.w=f(nw); a.h=f(nh); } }
  p.pushed={moved,pts,grow};
}
function unpush(p){
  const P=p.pushed||{};
  (P.moved||[]).forEach(({id,dx,dy})=>{ const m=getNode(id); if(m){ m.x=f(m.x-dx); m.y=f(m.y-dy); } });
  (P.pts||[]).forEach(({id,k,dx,dy})=>{ const e=getEdge(id); if(e&&e[k]) e[k]={x:e[k].x-dx,y:e[k].y-dy}; });
  (P.grow||[]).forEach(({id,dw,dh})=>{ const a=getNode(id); if(a){ a.w=f(a.w-dw); a.h=f(a.h-dh); } });
  delete p.pushed;
}
function toggleCollapse(id){
  const n=getNode(id); if(!n||n.shape!=='phase') return; checkpoint();
  if(n.collapsed){ const cw=n.w, ch=n.h; n.collapsed=false; if(n.ew){ n.w=n.ew; n.h=n.eh; } if(doc.pushOnExpand!==false) pushAround(n,cw,ch); }
  else { if(n.pushed) unpush(n); n.ew=n.w; n.eh=n.h; Object.assign(n,collapsedDims(n)); n.collapsed=true; }
  const hid=hiddenSet(), map=nodeMap(); sel=new Set([...sel].filter(x=>!hid.has(x)&&!(getEdge(x)&&edgeHidden(getEdge(x),map))));

function reparent(roots){ const set=new Set(roots||[]); for(const id of set){ const n=getNode(id); if(!n) continue; let p=n,g=0,under=false; while(p.parentId&&g++<30){ if(set.has(p.parentId)){ under=true; break; } p=getNode(p.parentId); if(!p) break; } if(!under) assignParent(n); } }

function nestSel(){

/* ---------- guided tour ---------- */
const TOUR=[
  ['.dock','Tools','Switch between select, pan, connector, free arrow and text, or pick a common shape. The small letter on each button is its keyboard shortcut.'],
  ['#lib','Shape library','Flowchart shapes, basic shapes, cards and notes, plus Electronics for circuit schematics and Chemistry for structural formulas. Click a part to place it, or drag it onto the canvas. Click a group heading to fold it away.'],
  ['#nodesL [data-kind="node"]:not([data-id="fr"])','Shapes and connections','Hover a shape and drag one of its blue dots onto another shape to connect them. Click a dot to add a linked shape. Double-click a shape to type in it.'],
  ['#edgesL [data-part="label"]','Labels on lines','Double-click a line to label it, then drag the label along it. Lines out of a decision are labelled Yes, then No, automatically.'],
  ['#panel','Inspector','Styles whatever you select. A decision gets one-click Yes and No branches; a line gets presets plus wire and chemical bond styles. With nothing selected it shows canvas settings and examples.'],
  ['.lib-item[data-shape="phase"]','Phases','Select some steps and press P to nest them in a phase. The arrow in its header collapses the phase into a summary card, and expanding it pushes nearby shapes aside.'],
  ['#bLib','More room','Hide or show the shape library and the inspector to give the canvas more space.'],
  ['#tplSel','Examples and guided builds','Load a finished example, or pick one under "Watch it built" to see it put together step by step with a moving cursor and captions. The same buttons are in the inspector when nothing is selected.'],
  ['.zoombar','Getting around','Zoom in and out, reset to 100% or fit the whole diagram. Scroll or hold Space and drag to pan.'],
  ['#bExport','Save and share','Your work saves in this browser automatically. Export a PNG, an SVG or a JSON copy you can import later. Press ? any time for shortcuts.'],
];
let tour=null;
function tourPrep(el){ if(!el) return; if(el.closest('#lib')){ const d=el.closest('details'); if(d&&!d.open) d.open=true; try{ el.scrollIntoView({block:'nearest'}); }catch(_){} } }
function tourVisible(el){ if(!el) return false; const r=el.getBoundingClientRect(); return r.width>4&&r.height>4&&r.bottom>0&&r.top<innerHeight-8&&r.right>0&&r.left<innerWidth; }
function startTour(){
  endTour(); closeSheets(); hideMenu(); sel.clear(); setTool('select'); afterSel();
  const steps=TOUR.filter(s=>{ const el=document.querySelector(s[0]); tourPrep(el); return tourVisible(el); });
  if(!steps.length) return;
  const block=document.createElement('div'); block.className='tour-block';
  const spot=document.createElement('div'); spot.className='tour-spot';
  const pop=document.createElement('div'); pop.className='tour-pop'; pop.setAttribute('role','dialog'); pop.setAttribute('aria-modal','true');
  document.body.append(block,spot,pop);
  tour={steps,i:0,block,spot,pop};
  block.addEventListener('pointerdown',e=>e.preventDefault());
  pop.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const a=b.dataset.t; if(a==='next') tourGo(1); else if(a==='prev') tourGo(-1); else endTour(); });
  window.addEventListener('keydown',tourKeys,true); window.addEventListener('resize',drawTour);
  drawTour();
}
function tourKeys(e){ if(!tour) return; e.stopPropagation(); if(e.key==='Escape'){ e.preventDefault(); endTour(); } else if(e.key==='ArrowRight'||e.key==='Enter'){ e.preventDefault(); tourGo(1); } else if(e.key==='ArrowLeft'){ e.preventDefault(); tourGo(-1); } }
function tourGo(d){ if(!tour) return; const n=tour.i+d; if(n>=tour.steps.length){ endTour(); toast('Tour finished. Reopen it from Tour in the header.'); return; } tour.i=clamp(n,0,tour.steps.length-1); drawTour(); }
function endTour(){ if(!tour) return; tour.block.remove(); tour.spot.remove(); tour.pop.remove(); window.removeEventListener('keydown',tourKeys,true); window.removeEventListener('resize',drawTour); tour=null; }
function drawTour(){
  if(!tour) return; const {steps,i,spot,pop}=tour; const [selq,title,body]=steps[i];
  const el=document.querySelector(selq); tourPrep(el); if(!tourVisible(el)){ if(i<steps.length-1){ tour.i++; drawTour(); } else endTour(); return; }
  const last=i===steps.length-1;
  pop.innerHTML=`<h3>${esc(title)}</h3><p>${esc(body)}</p><div class="tour-foot"><span class="cnt">${i+1} / ${steps.length}</span><button class="btn small" data-t="end">Skip</button>${i?'<button class="btn small" data-t="prev">Back</button>':''}<button class="btn small primary" data-t="next">${last?'Done':'Next'}</button></div>`;
  const r=el.getBoundingClientRect(), pad=6;
  const sx=Math.max(4,r.left-pad), sy=Math.max(4,r.top-pad), sw=Math.min(innerWidth-8,r.right+pad)-sx, sh=Math.min(innerHeight-8,r.bottom+pad)-sy;
  Object.assign(spot.style,{left:sx+'px',top:sy+'px',width:sw+'px',height:sh+'px'});
  const pw=pop.offsetWidth, ph=pop.offsetHeight, m=12; let x,y;
  if(sy+sh+m+ph<innerHeight-8){ y=sy+sh+m; x=sx+sw/2-pw/2; }
  else if(sy-m-ph>8){ y=sy-m-ph; x=sx+sw/2-pw/2; }
  else if(sx+sw+m+pw<innerWidth-8){ x=sx+sw+m; y=sy+sh/2-ph/2; }
  else if(sx-m-pw>8){ x=sx-m-pw; y=sy+sh/2-ph/2; }
  else { x=innerWidth/2-pw/2; y=innerHeight-ph-16; }
  pop.style.left=clamp(x,16,innerWidth-pw-16)+'px'; pop.style.top=clamp(y,8,innerHeight-ph-8)+'px';
  const nb=pop.querySelector('[data-t="next"]'); nb&&nb.focus();
}

/* ---------- boot ---------- */
$('#staticDefs').innerHTML=STATIC_DEFS;
buildDock(); buildLib();
let restored=false;
try{ const raw=localStorage.getItem(KEY); if(raw){ const s=JSON.parse(raw); if(s&&s.doc&&Array.isArray(s.doc.nodes)){ doc=normalizeDoc(s.doc); if(s.view&&s.view.z) view=s.view; restored=true; } } }catch(_){ storageOK=false; }
if(!restored) doc=refundDoc();
setTool('select'); applyView(); refresh(true);
if(!restored) requestAnimationFrame(fit);
if(document.fonts){ document.fonts.ready.then(()=>render()); document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',()=>render()); }
})();
</script>
